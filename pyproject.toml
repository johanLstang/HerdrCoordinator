[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "herdr-coordinator"
version = "0.1.0"
description = "Deterministic orchestration of Herdr development agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.13,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
herdr-coordinator = "orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/worker-v1.md" = "orchestrator/prompts/worker-v1.md"
"prompts/integration-review-v1.md" = "orchestrator/prompts/integration-review-v1.md"
"prompts/integration-v1.md" = "orchestrator/prompts/integration-v1.md"
